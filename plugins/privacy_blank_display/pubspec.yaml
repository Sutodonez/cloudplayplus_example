name: privacy_blank_display
description: Host privacy / blank-display (防窥) for CloudPlayPlus Plus — blank monitors or privacy screensaver overlays excluded from capture.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: PrivacyBlankDisplayPluginCApi
